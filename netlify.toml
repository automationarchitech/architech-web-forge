[build]
  # Build command for static site deployment
  command = "npm run build"
  # Directory containing the built static files
  publish = "dist/public"

# Redirect all routes to index.html for SPA routing (except sitemap.xml)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Environment variables (if needed)
[build.environment]
  NODE_VERSION = "20"

# Headers for security and optimization
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"