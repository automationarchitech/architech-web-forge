[build]
  # Build command for static site deployment with sitemap generation
  command = "node build-static.js"
  # Directory containing the built static files
  publish = "dist/public"

# Note: Netlify sitemap plugin removed since we generate our own sitemap.xml
# Our custom sitemap is more comprehensive and works better with hash routing

# Redirect /something/index.html to /something/ for all static routes
[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301

# Redirect all routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (if needed)
[build.environment]
  NODE_VERSION = "20"

# Headers for security and optimization
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"