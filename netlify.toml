# Netlify configuration for Astro site with Forms

[build]
  publish = "dist"
  command = "npm run build"

# Form submissions will automatically send to the form admin email
# Configure additional notifications in Netlify Dashboard:
# Site settings > Forms > Form notifications

# Automation Architech is now HyperLight Ops (2026-11-16).
# Every request to the automationarchitech.com domains 301s to the matching page on hyperlightops.com.
# Insight and case-study slugs are the same on both sites, so those keep their paths;
# the old service pages go to /approach/, and anything else goes to the home page.
# Rules are scoped to the production hosts, so *.netlify.app deploy previews still serve this site.
# They sit above every other rule because Netlify uses the first match.
# Page redirects add ?via=automationarchitech so GA4 on hyperlightops.com can count redirected visits
# (filter Page location contains "via=automationarchitech") without overwriting the visit's real source.
# hyperlightops.com pages carry a canonical tag, so the parameter doesn't create duplicate URLs in Google.

[[redirects]]
  from = "https://automationarchitech.com/blog/hello-world/"
  to = "https://hyperlightops.com/insights/?via=automationarchitech"
  status = 301
  force = true

[[redirects]]
  from = "https://automationarchitech.com/blog/hammer/"
  to = "https://hyperlightops.com/insights/?via=automationarchitech"
  status = 301
  force = true

[[redirects]]
  from = "https://automationarchitech.com/blog"
  to = "https://hyperlightops.com/insights/?via=automationarchitech"
  status = 301
  force = true

[[redirects]]
  from = "https://automationarchitech.com/blog/*"
  to = "https://hyperlightops.com/insights/:splat?via=automationarchitech"
  status = 301
  force = true

[[redirects]]
  from = "https://automationarchitech.com/insights/*"
  to = "https://hyperlightops.com/insights/:splat?via=automationarchitech"
  status = 301
  force = true

